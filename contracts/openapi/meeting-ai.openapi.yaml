openapi: 3.1.0
info:
  title: Meeting AI Core Internal API
  version: 1.0.0
  description: >-
    Compute-only contract called by Meeting Service and the LiveKit Agent.
    Meeting AI Core does not read PostgreSQL or MinIO and sends all durable
    results to Meeting Service through the versioned event envelope.
servers:
  - url: http://meeting-ai-api:8001
    description: Docker internal network
security:
  - ServiceKey: []
paths:
  /health/live:
    get:
      operationId: meetingAiLiveness
      security: []
      responses:
        "200": {$ref: "#/components/responses/HealthResponse"}
  /health/ready:
    get:
      operationId: meetingAiReadiness
      security: []
      responses:
        "200": {$ref: "#/components/responses/HealthResponse"}
        "503": {$ref: "#/components/responses/ProblemResponse"}
  /internal/v1/sessions:
    post:
      operationId: createMeetingAiSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/ai-session.schema.json"
      responses:
        "201": {$ref: "#/components/responses/SessionResponse"}
        "200": {$ref: "#/components/responses/SessionResponse"}
        "409": {$ref: "#/components/responses/ProblemResponse"}
        "503": {$ref: "#/components/responses/ProblemResponse"}
  /internal/v1/sessions/{runtime_session_id}:
    parameters:
      - $ref: "#/components/parameters/RuntimeSessionId"
    get:
      operationId: getMeetingAiSession
      responses:
        "200": {$ref: "#/components/responses/SessionResponse"}
        "404": {$ref: "#/components/responses/ProblemResponse"}
  /internal/v1/sessions/{runtime_session_id}/stop:
    parameters:
      - $ref: "#/components/parameters/RuntimeSessionId"
    post:
      operationId: stopMeetingAiSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": {$ref: "#/components/responses/SessionResponse"}
        "404": {$ref: "#/components/responses/ProblemResponse"}
        "409": {$ref: "#/components/responses/ProblemResponse"}
  /internal/v1/sessions/{runtime_session_id}/participants:
    parameters:
      - $ref: "#/components/parameters/RuntimeSessionId"
    post:
      operationId: updateMeetingAiParticipants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, snapshot_revision, participants, hotwords]
              properties:
                schema_version: {const: 1}
                snapshot_revision: {type: integer, minimum: 1}
                participants:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [user_id, display_name]
                    properties:
                      user_id: {type: string, format: uuid}
                      display_name: {type: string, minLength: 1, maxLength: 160}
                hotwords:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [term, source]
                    properties:
                      term: {type: string, minLength: 1, maxLength: 160}
                      weight: {type: number, minimum: 0}
                      source: {type: string, enum: [participant, manual, adaptive]}
      responses:
        "200": {$ref: "#/components/responses/SessionResponse"}
        "404": {$ref: "#/components/responses/ProblemResponse"}
        "409": {$ref: "#/components/responses/ProblemResponse"}
  /internal/v1/sessions/{runtime_session_id}/analyze:
    parameters:
      - $ref: "#/components/parameters/RuntimeSessionId"
    post:
      operationId: analyzeMeetingEvidence
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, generation_id, meeting, base_transcript_revision, segments]
              properties:
                schema_version: {const: 1}
                generation_id: {type: string, format: uuid}
                meeting:
                  type: object
                  additionalProperties: false
                  required: [title, started_at]
                  properties:
                    title: {type: string, maxLength: 500}
                    started_at: {type: [string, "null"], format: date-time}
                base_transcript_revision: {type: integer, minimum: 1}
                segments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [segment_id, speaker_label, content_text, started_at, ended_at]
                    properties:
                      segment_id: {type: string, minLength: 1, maxLength: 160}
                      speaker_user_id: {type: [string, "null"], format: uuid}
                      speaker_label: {type: string, minLength: 1, maxLength: 160}
                      content_text: {type: string, minLength: 1}
                      started_at: {type: string, format: date-time}
                      ended_at: {type: string, format: date-time}
                previous_document:
                  oneOf:
                    - $ref: "../schemas/minutes-document.schema.json"
                    - type: "null"
      responses:
        "202":
          description: Composition accepted; result arrives as minutes.updated event.
        "404": {$ref: "#/components/responses/ProblemResponse"}
        "409": {$ref: "#/components/responses/ProblemResponse"}
        "503": {$ref: "#/components/responses/ProblemResponse"}
  /internal/v1/enrollments/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: createSpeakerProfile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [display_name, audio]
              properties:
                display_name: {type: string, minLength: 1, maxLength: 160}
                audio: {type: string, format: binary}
      responses:
        "200": {description: Enrollment quality and profile version.}
        "422": {$ref: "#/components/responses/ProblemResponse"}
    get:
      operationId: getSpeakerProfile
      responses:
        "200": {description: Profile status.}
        "404": {$ref: "#/components/responses/ProblemResponse"}
    delete:
      operationId: deleteSpeakerProfile
      responses:
        "204": {description: Profile removed or absent.}
  /internal/v1/agent/assignment:
    get:
      operationId: getLiveKitAgentAssignment
      parameters:
        - name: after_generation
          in: query
          schema: {type: integer, minimum: 0}
      responses:
        "200":
          description: Current assignment or no-content marker.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../schemas/ai-session.schema.json"
                  - type: object
                    additionalProperties: false
                    required: [assignment_generation, status]
                    properties:
                      assignment_generation: {type: integer, minimum: 0}
                      status: {const: IDLE}
  /internal/v1/agent/status:
    post:
      operationId: updateLiveKitAgentStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, assignment_generation, status]
              properties:
                schema_version: {const: 1}
                assignment_generation: {type: integer, minimum: 1}
                runtime_session_id: {type: [string, "null"], format: uuid}
                status: {type: string, enum: [CONNECTING, READY, FAILED, STOPPED]}
                reason: {type: [string, "null"], maxLength: 1000}
      responses:
        "202": {description: Agent state accepted.}
components:
  securitySchemes:
    ServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
  parameters:
    RuntimeSessionId:
      name: runtime_session_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: user_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 160}
  schemas:
    SessionState:
      type: object
      additionalProperties: false
      required: [schema_version, runtime_session_id, assignment_generation, status]
      properties:
        schema_version: {const: 1}
        runtime_session_id: {type: string, format: uuid}
        assignment_generation: {type: integer, minimum: 1}
        status: {type: string, enum: [STARTING, READY, RECORDING, STOPPING, COMPLETED, FAILED]}
        reason: {type: [string, "null"]}
    Problem:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id]
      properties:
        code: {type: string}
        message: {type: string}
        correlation_id: {type: string}
        details: {type: object}
  responses:
    HealthResponse:
      description: AI process health.
      content:
        application/json:
          schema:
            type: object
            required: [status, service]
            properties:
              status: {type: string, enum: [ok, degraded]}
              service: {const: meeting-ai-core}
              models: {type: object}
    SessionResponse:
      description: AI session state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionState"
    ProblemResponse:
      description: Request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
